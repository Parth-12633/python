[build]
command = "npm run build"
publish = "dist"

[build.environment]
SECRETS_SCAN_OMIT_KEYS = "VITE_EMAILJS_PUBLIC_KEY,VITE_EMAILJS_SERVICE_ID,VITE_EMAILJS_TEMPLATE_ID,VITE_APP_URL,VITE_OG_IMAGE_URL,VITE_WHATSAPP_NUMBER"

[[redirects]]
from = "/wedding"
to = "/demos/heritage-wedding/index.html"
status = 200

[[redirects]]
from = "/akash-drashti"
to = "/demos/heritage-wedding/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
